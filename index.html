<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>베리굿초콜릿 - 체험단 모집</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="scroll-container">
        <div class="sticky-wrapper">
            <video id="hero-video" muted playsinline preload="auto">
                <source src="https://github.com/nam9295-cmyk/asset/raw/refs/heads/main/freepik__-__95730.mp4"
                    type="video/mp4">
            </video>

            <!-- 중앙 로고 -->
            <div class="hero-logo">
                <img src="logo.png" alt="VCC Logo">
            </div>

            <!-- 스크롤 텍스트 배지들 (모바일 전용) -->
            <div class="scroll-badges">
                <div class="choco-badge" data-appear="0.1">
                    <span>Cacao 100%</span>
                </div>
                <div class="choco-badge" data-appear="0.3">
                    <span>Cacao 70.5%</span>
                </div>
                <div class="choco-badge" data-appear="0.5">
                    <span>Cacao 57.9%</span>
                </div>
                <div class="choco-badge" data-appear="0.7">
                    <span>Milk Chocolate</span>
                </div>
            </div>
        </div>
    </div>

    <div class="content-section">
        <h2>여기서부터 상세 내용이 나옵니다.</h2>
    </div>

    <script src="script.js"></script>
</body>

</html>
