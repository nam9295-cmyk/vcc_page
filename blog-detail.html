<!DOCTYPE html>
<html lang="ko">

<head>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TKQQZ2E0DF"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-TKQQZ2E0DF');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Very Goût - Blog Detail</title>
    <!-- Quill CSS (for consistent styling of content) -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }

        .blog-detail-section {
            padding: 150px 20px 60px;
            max-width: 800px;
            margin: 0 auto;
        }

        .post-header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid #eee;
            padding-bottom: 40px;
        }

        .post-title {
            font-family: 'Addington CF', serif;
            font-size: 2rem;
            color: #3E2512;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .post-date {
            color: #888;
            font-size: 0.9rem;
            font-family: 'Pretendard', sans-serif;
        }

        .post-content {
            font-family: 'Pretendard', sans-serif;
            line-height: 1.8;
            color: #333;
            min-height: 300px;
        }

        /* Quill content overrides for display */
        .post-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 20px auto;
            display: block;
        }

        .back-btn-container {
            margin-top: 60px;
            text-align: center;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #3E2512;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background-color: #5D3A1A;
        }
    </style>
</head>

<body>

    <!-- ========== 헤더 (항상 보임) ========== -->
    <header class="site-header visible" id="site-header">
        <button class="hamburger-menu" id="hamburger-btn" aria-label="메뉴">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="header-logo">
            <a href="index.html">
                <img src="logo.png" alt="Very Goût">
            </a>
        </div>
        <div class="header-spacer"></div>
    </header>

    <!-- 모바일 사이드 메뉴 -->
    <nav class="mobile-nav" id="mobile-nav">
        <button class="close-menu" id="close-menu-btn">×</button>
        <ul>
            <li><a href="index.html#signature">SIGNATURE</a></li>
            <li><a href="index.html#detox-tea">DETOX TEA</a></li>
            <li><a href="index.html#coffee">COFFEE</a></li>
            <li><a href="index.html#icecream">ICECREAM</a></li>
            <li><a href="index.html#dessert">DESSERT</a></li>
            <li><a href="blog.html">BLOG</a></li>
        </ul>
    </nav>
    <div class="mobile-nav-overlay" id="mobile-nav-overlay"></div>

    <!-- ========== 블로그 상세 컨텐츠 ========== -->
    <article class="blog-detail-section">
        <div id="post-container">
            <div class="loading-spinner">내용을 불러오는 중입니다...</div>
        </div>

        <div class="back-btn-container">
            <a href="blog.html" class="back-btn">목록으로 돌아가기</a>
        </div>
    </article>

    <!-- Firebase SDK & Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCZdp-mfMX8BHu1Wv2BvQVVJVT9E6TT7E",
            authDomain: "verygood-d36c5.firebaseapp.com",
            projectId: "verygood-d36c5",
            storageBucket: "verygood-d36c5.firebasestorage.app",
            messagingSenderId: "789302109242",
            appId: "1:789302109242:web:9c466ca4c5cabba1cdc103",
            measurementId: "G-H6HKSZYN39"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // URL에서 ID 파라미터 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        const postContainer = document.getElementById('post-container');

        function formatDate(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleDateString('ko-KR', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        async function loadPost() {
            if (!postId) {
                postContainer.innerHTML = '<p style="text-align:center;">잘못된 접근입니다.</p>';
                return;
            }

            try {
                const docRef = doc(db, "drink_stories", postId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const post = docSnap.data();

                    postContainer.innerHTML = `
                        <div class="post-header">
                            <h1 class="post-title">${post.title}</h1>
                            <div class="post-date">${formatDate(post.date)}</div>
                        </div>
                        <div class="post-content ql-editor" style="padding: 0;">
                            ${post.content}
                        </div>
                    `;
                } else {
                    postContainer.innerHTML = '<p style="text-align:center;">삭제되었거나 존재하지 않는 글입니다.</p>';
                }
            } catch (error) {
                console.error("Error getting document:", error);
                postContainer.innerHTML = '<p style="text-align:center;">글을 불러오는 중 오류가 발생했습니다.</p>';
            }
        }

        loadPost();

        // 모바일 메뉴 스크립트 (공통)
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const mobileNav = document.getElementById('mobile-nav');
        const closeMenuBtn = document.getElementById('close-menu-btn');
        const mobileNavOverlay = document.getElementById('mobile-nav-overlay');

        function openMobileNav() {
            if (mobileNav) mobileNav.classList.add('open');
            if (mobileNavOverlay) mobileNavOverlay.classList.add('visible');
            document.body.style.overflow = 'hidden';
        }

        function closeMobileNav() {
            if (mobileNav) mobileNav.classList.remove('open');
            if (mobileNavOverlay) mobileNavOverlay.classList.remove('visible');
            document.body.style.overflow = '';
        }

        if (hamburgerBtn) hamburgerBtn.addEventListener('click', openMobileNav);
        if (closeMenuBtn) closeMenuBtn.addEventListener('click', closeMobileNav);
        if (mobileNavOverlay) mobileNavOverlay.addEventListener('click', closeMobileNav);

    </script>
</body>

</html>
